# Release automatique : quand la version de package.json change sur main (ou à la main, bouton « Run workflow »),
# on construit le plugin, on lance les tests, on atteste la provenance des fichiers livrés et on crée la release
# GitHub (tag = la version, sans « v », comme le demande le catalogue des plugins Obsidian) avec main.js,
# manifest.json et styles.css. Si la release de cette version existe déjà, rien ne se passe.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write      # créer le tag et la release
  id-token: write      # signer l'attestation
  attestations: write  # publier l'attestation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lire la version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "La version $v a déjà son tag : pas de nouvelle release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer Node
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        if: steps.version.outputs.exists == 'false'
        run: npm ci

      - name: Construire
        if: steps.version.outputs.exists == 'false'
        run: npm run build

      - name: Tester (version lisible et version minifiée)
        if: steps.version.outputs.exists == 'false'
        run: |
          npm test
          npm run lint

      - name: Vérifier les fichiers livrés
        if: steps.version.outputs.exists == 'false'
        run: |
          v="${{ steps.version.outputs.version }}"
          test -s release/main.js && test -s release/styles.css && test -s release/manifest.json
          m=$(node -p "require('./release/manifest.json').version")
          [ "$m" = "$v" ] || { echo "manifest.json annonce $m, package.json $v"; exit 1; }
          sha256sum release/main.js release/manifest.json release/styles.css

      - name: Notes de version (section du journal des changements)
        if: steps.version.outputs.exists == 'false'
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {p=1; print; next} p && /^## / {exit} p' docs/NOTES-historique.md > release-notes.md
          [ -s release-notes.md ] || echo "Version $v." > release-notes.md
          printf '\n---\nInstallation : copier `main.js`, `manifest.json` et `styles.css` dans `<coffre>/.obsidian/plugins/age-writer/`.\nProjet de fan, sans lien avec Cyan Worlds.\n' >> release-notes.md

      - name: Attester la provenance des fichiers
        # Les attestations demandent un dépôt public (ou GitHub Enterprise Cloud pour un dépôt privé).
        if: steps.version.outputs.exists == 'false' && github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Créer la release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
